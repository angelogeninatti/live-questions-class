# Pubblica l'app su GitHub Pages a ogni push sul ramo `main`.
# Prerequisiti (una volta sola, nelle impostazioni del repository):
#  - Settings → Pages → Source: "GitHub Actions";
#  - Settings → Secrets and variables → Actions → Variables: FIREBASE_CONFIG
#    con la configurazione Firebase in formato JSON (vedi .env.example).
name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permette anche l'avvio manuale dalla scheda "Actions"

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy alla volta; uno nuovo annulla quello in coda.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Controllo dei tipi
        run: npx tsc --noEmit

      - name: Build
        run: npx vite build
        env:
          VITE_FIREBASE_CONFIG: ${{ vars.FIREBASE_CONFIG }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
